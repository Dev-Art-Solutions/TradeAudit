[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tradeaudit"
version = "0.1.0"
description = "MT5 Trade Audit & Analytics Application"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "TradeAudit Team" }
]
dependencies = [
    "PySide6>=6.6.0",
    "SQLAlchemy>=2.0.0",
    "pydantic-settings>=2.0.0",
    "keyring>=24.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pywebview>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "httpx>=0.27.0",
]
build = [
    "pyinstaller>=6.0.0",
    "Pillow>=10.0.0",
]

[project.scripts]
tradeaudit = "tradeaudit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

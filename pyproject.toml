[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tradeaudit"
version = "1.0.0"
description = "Production-oriented MetaTrader 5 trade auditing, risk analytics, strategy-compliance and behavioral intelligence platform."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Dev Art Solutions" }
]

[project.urls]
Repository = "https://github.com/Dev-Art-Solutions/TradeAudit"
Homepage = "https://devart.solutions"
dependencies = [
    "PySide6>=6.6.0",
    "SQLAlchemy>=2.0.0",
    "pydantic-settings>=2.0.0",
    "keyring>=24.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pywebview>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "httpx>=0.27.0",
    "playwright>=1.40.0",
    "pytest-playwright>=0.4.0",
]
build = [
    "pyinstaller>=6.0.0",
    "Pillow>=10.0.0",
]

[project.scripts]
tradeaudit = "tradeaudit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
